apiVersion: apps/v1

kind: Deployment

metadata:

  name: rabbitmq

  namespace: smart-parking

spec:

  replicas: 1

  selector:

    matchLabels:

      app: rabbitmq

  template:

    metadata:

      labels:

        app: rabbitmq

    spec:

      containers:

      - name: rabbitmq

        image: rabbitmq:3-management

        resources:
        
          requests:

            memory: "2Gi"

            cpu: "500m"

          limits:

            memory: "4Gi"

        ports:

        - containerPort: 5672

        - containerPort: 15672